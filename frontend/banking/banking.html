<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Business Bank (demo)</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS v4 browser build (needs internet; fine for a demo) -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <style type="text/tailwindcss">
    /* Same design tokens as admin.html */
    @theme {
      --font-sans: "Onest", ui-sans-serif, system-ui, sans-serif;

      --color-canvas: #E9EEF3;
      --color-surface: #FFFFFF;
      --color-subtle: #F3F6F9;
      --color-line: #D9E1E9;
      --color-ink: #14233D;
      --color-muted: #56667D;

      --color-cobalt: #0F2A55;
      --color-cobalt-top: #17407F;
      --color-cobalt-soft: #B4C4DE;

      --color-brand-50: #E8F6F7;
      --color-brand-100: #CBEDF0;
      --color-brand-300: #74D0D9;
      --color-brand-400: #3BB9C5;
      --color-brand-500: #179FAC;
      --color-brand-600: #0B7F8B;
      --color-brand-700: #08656F;
    }

    /* The bell rings once when there are unread notifications */
    @media (prefers-reduced-motion: no-preference) {
      .bell-ring { animation: bell-ring 900ms ease-in-out; transform-origin: 50% 15%; }
    }
    @keyframes bell-ring {
      0%, 100% { transform: rotate(0); }
      15% { transform: rotate(14deg); }
      30% { transform: rotate(-12deg); }
      45% { transform: rotate(8deg); }
      60% { transform: rotate(-5deg); }
      75% { transform: rotate(2deg); }
    }
  </style>
</head>
<body class="min-h-screen bg-canvas font-sans text-ink antialiased">

  <!-- ============ Login ============ -->
  <section data-view="login" class="flex min-h-screen items-center justify-center px-4 py-10" hidden>
    <div class="w-full max-w-sm">
      <div class="mb-6 flex items-center justify-center gap-3">
        <span class="grid size-10 place-items-center rounded-xl bg-cobalt text-brand-300">
          <svg viewBox="0 0 24 24" fill="currentColor" class="size-6" aria-hidden="true"><path d="M6 6h12v12H6z"/><path d="M12 3.5 20.5 12 12 20.5 3.5 12z"/></svg>
        </span>
        <span class="text-lg font-semibold">Business Bank</span>
      </div>

      <form id="login-form" novalidate class="rounded-2xl border border-line bg-surface p-6 shadow-sm shadow-cobalt/5">
        <h1 class="text-xl font-semibold">Log in</h1>
        <p class="mt-1 text-sm text-muted">Online banking for your business.</p>

        <label for="login-id" class="mt-6 mb-1.5 block text-sm font-medium">Customer ID</label>
        <input id="login-id" name="customerId" type="text" autocomplete="username" autocapitalize="characters" placeholder="C-01"
          class="h-10 w-full rounded-lg border border-line bg-surface px-3 text-sm outline-none transition placeholder:text-muted/60 focus:border-brand-500 focus:ring-4 focus:ring-brand-500/15">

        <label for="login-password" class="mt-4 mb-1.5 block text-sm font-medium">Password</label>
        <input id="login-password" name="password" type="password" autocomplete="current-password"
          class="h-10 w-full rounded-lg border border-line bg-surface px-3 text-sm outline-none transition focus:border-brand-500 focus:ring-4 focus:ring-brand-500/15">

        <p id="login-error" role="alert" class="mt-3 hidden rounded-lg bg-red-50 px-3 py-2 text-sm text-red-700"></p>

        <button type="submit"
          class="mt-6 h-10 w-full rounded-lg bg-brand-600 text-sm font-medium text-white shadow-sm transition-colors hover:bg-brand-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-600">
          Log in
        </button>
      </form>

      <p class="mt-4 text-center text-xs text-muted">Demo: use a customer ID such as C-01 and the password 123.</p>
    </div>
  </section>

  <!-- ============ Signed-in app ============ -->
  <div data-shell hidden>
    <header class="bg-cobalt bg-linear-to-r from-cobalt-top to-cobalt text-white">
      <div class="mx-auto flex h-16 max-w-3xl items-center justify-between px-4">
        <a href="#home" class="flex items-center gap-2.5" aria-label="Business Bank, home">
          <span class="grid size-9 place-items-center rounded-xl bg-white/10 text-brand-300 ring-1 ring-white/15">
            <svg viewBox="0 0 24 24" fill="currentColor" class="size-5" aria-hidden="true"><path d="M6 6h12v12H6z"/><path d="M12 3.5 20.5 12 12 20.5 3.5 12z"/></svg>
          </span>
          <span class="font-semibold">Business Bank</span>
        </a>

        <div class="flex items-center gap-1">
          <a href="#notifications" id="bell" aria-label="Notifications"
            class="relative grid size-10 place-items-center rounded-full transition-colors hover:bg-white/10">
            <svg id="bell-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" class="size-6" aria-hidden="true">
              <path d="M6 9.5a6 6 0 0 1 12 0c0 4.5 1.8 6 1.8 6H4.2S6 14 6 9.5z"/><path d="M10 19a2.2 2.2 0 0 0 4 0"/>
            </svg>
            <span id="bell-count" hidden
              class="absolute -top-0.5 -right-0.5 grid h-5 min-w-5 place-items-center rounded-full bg-red-500 px-1 text-[11px] leading-none font-semibold text-white ring-2 ring-cobalt-top"></span>
          </a>
          <button id="logout" type="button"
            class="rounded-lg px-3 py-2 text-sm font-medium text-cobalt-soft transition-colors hover:bg-white/10 hover:text-white">Log out</button>
        </div>
      </div>
    </header>

    <main class="mx-auto max-w-3xl px-4 py-8">
      <!-- Home: the rest of the banking app would live here -->
      <section data-view="home" hidden>
        <p class="text-sm text-muted">Hello,</p>
        <h1 id="home-name" class="text-2xl font-semibold tracking-tight"></h1>
      </section>

      <!-- Notifications -->
      <section data-view="notifications" hidden>
        <a href="#home" class="inline-flex items-center gap-1.5 text-sm font-medium text-muted transition-colors hover:text-ink">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-4" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
          Home
        </a>
        <h1 class="mt-3 text-2xl font-semibold tracking-tight">Notifications</h1>
        <div id="notification-list" class="mt-5 space-y-4"></div>
      </section>

      <!-- Loan request (filled in by banking.js) -->
      <section data-view="loan" hidden>
        <div id="loan-view"></div>
      </section>
    </main>
  </div>

  <script src="banking.js"></script>
</body>
</html>

services:
  api:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      AWS_EC2_METADATA_DISABLED: "false"
      Bedrock__Region: ${BEDROCK_REGION:-eu-central-1}
      Bedrock__ModelId: ${BEDROCK_MODEL_ID:-eu.amazon.nova-micro-v1:0}
    volumes:
      - /home/ubuntu/tenderai-data/tenderai.db:/app/tenderai.db
